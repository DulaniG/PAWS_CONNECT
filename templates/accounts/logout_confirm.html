{% extends 'base.html' %}

{% block title %}Confirm Logout | PAWS CONNECT{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="paws-card text-center">

            <h2 class="paws-heading mb-3">Confirm Logout</h2>

            <p class="paws-subtitle mb-4">
                Are you sure you want to logout from PAWS CONNECT?
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="d-flex flex-column flex-md-row justify-content-center gap-3">
                    <a href="/accounts/dashboard/" class="btn btn-outline-paws">
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-paws">
                        Yes, Logout
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

{% endblock %}
